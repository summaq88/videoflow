name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: web/android
        run: |
          mkdir -p ../android/capacitor-cordova-android-plugins/src/main/java ../android/capacitor-cordova-android-plugins/src/main/res
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../VideoFlow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoFlow-APK
          path: VideoFlow.apk

      - name: Publish APK as a GitHub release (easy download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk VideoFlow.apk --title "VideoFlow APK" --notes "Build ${{ github.run_number }} – install VideoFlow.apk on Android 7 or newer." --latest
